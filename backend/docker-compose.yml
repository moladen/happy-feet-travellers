# Happy Feet Travellers — API + PostgreSQL
#
# From backend/:
#   docker compose up --build -d
#   docker compose logs -f api
#   docker compose down
#
# Copy .env.docker.example to .env and set JWT_SECRET before production use.

name: happy-feet-backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: happy-feet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-happy_feet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-happy_feet}
      POSTGRES_DB: ${POSTGRES_DB:-happy_feet}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-happy_feet} -d ${POSTGRES_DB:-happy_feet}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: happy-feet-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      # Overrides localhost URL from .env — use Docker network hostname
      DATABASE_URL: postgresql://${POSTGRES_USER:-happy_feet}:${POSTGRES_PASSWORD:-happy_feet}@postgres:5432/${POSTGRES_DB:-happy_feet}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRY: ${JWT_EXPIRY:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@happyfeet.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-200}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-false}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
